name: ISHBounty Agent CI Repair

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: ishbounty-agent-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch != '' &&
      startsWith(github.event.workflow_run.head_branch, 'agent/issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download trusted agent source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}

      - name: Collect failed CI logs
        id: logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --log-failed > /tmp/ishbounty-ci.log || true
          echo "path=/tmp/ishbounty-ci.log" >> "$GITHUB_OUTPUT"

      - name: Determine target repository and PR
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "repo=${{ github.event.workflow_run.repository.full_name }}" >> "$GITHUB_OUTPUT"
          PR=$(gh api "repos/${{ github.event.workflow_run.repository.full_name }}/commits/$SHA/pulls" --jq '.[0].number')
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Repair failed PR
        env:
          ISHB_AGENT_TOKEN: ${{ github.token }}
          ISHB_LLM_API_KEY: ${{ secrets.ISHB_LLM_API_KEY }}
          ISHB_LLM_BASE_URL: ${{ vars.ISHB_LLM_BASE_URL || 'https://api.openai.com/v1/chat/completions' }}
          ISHB_LLM_MODEL: ${{ vars.ISHB_LLM_MODEL || 'gpt-5.6-luna' }}
          ISHB_TARGET_REPO: ${{ steps.target.outputs.repo }}
          ISHB_PR_NUMBER: ${{ steps.target.outputs.pr }}
          ISHB_CI_LOGS: ${{ steps.logs.outputs.path }}
        run: |
          export ISHB_CI_LOGS="$(cat /tmp/ishbounty-ci.log)"
          python agent/repair_pr.py
