name: Security

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e './backend[test]'
          pip install 'pip-audit>=2.7,<3' 'ruff>=0.6,<1'
      - name: Compile
        run: python -m compileall backend/app
      - name: Tests
        run: pytest -q backend/tests
      - name: Lint
        run: |
          ruff check backend --fix
          ruff check backend
      - name: Dependency audit
        run: pip-audit
